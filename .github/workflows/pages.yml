name: Publish to GitHub Pages

# Publishes the static site to the `gh-pages` branch.
# GitHub Pages source: Settings → Pages → "Deploy from a branch" → gh-pages / (root)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp -r index.html assets .nojekyll _site/
          ls -R _site | head -50

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish site from ${{ github.sha }}"
